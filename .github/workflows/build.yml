name: Build

on:
  workflow_dispatch:
  push:
    branches: [ Next ]
  pull_request:
    branches: [ Next ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore WinUI3Desktop.csproj

    - name: Build
      run: >
        dotnet build WinUI3Desktop.csproj
        -c ${{ matrix.configuration }}
        -f net10.0-windows10.0.19041.0
        -p:Platform=${{ matrix.platform }}
        --no-restore

    - name: Publish
      if: github.event_name != 'pull_request'
      run: >
        dotnet publish WinUI3Desktop.csproj
        -c ${{ matrix.configuration }}
        -f net10.0-windows10.0.19041.0
        -r win-${{ matrix.platform }}
        --self-contained false
        -p:Platform=${{ matrix.platform }}
        -o artifacts/Launcher-${{ matrix.configuration }}-${{ matrix.platform }}

    - name: Upload artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: Launcher-${{ matrix.configuration }}-${{ matrix.platform }}
        path: artifacts/
        if-no-files-found: warn
