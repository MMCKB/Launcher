name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c ${{ matrix.configuration }} -f net10.0-windows10.0.19041.0 --no-restore

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Launcher-${{ matrix.configuration }}-${{ matrix.platform }}
        path: bin/${{ matrix.platform }}/${{ matrix.configuration }}/net10.0-windows10.0.19041.0/
