name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '编译配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      platform:
        description: '目标平台'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - x86
  push:
    branches: [ Next ]
  pull_request:
    branches: [ Next ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore WinUI3Desktop.csproj

    - name: Build
      run: >
        dotnet build WinUI3Desktop.csproj
        -c ${{ github.event_name == 'push' && 'Release' || github.event.inputs.configuration }}
        -f net10.0-windows10.0.19041.0
        -p:Platform=${{ matrix.platform }}
        --no-restore

    - name: Publish
      if: github.event_name != 'pull_request'
      run: >
        dotnet publish WinUI3Desktop.csproj
        -c ${{ github.event_name == 'push' && 'Release' || github.event.inputs.configuration }}
        -f net10.0-windows10.0.19041.0
        -r win-${{ matrix.platform }}
        --self-contained false
        --no-build
        -p:Platform=${{ matrix.platform }}
        -o artifacts/Launcher-${{ matrix.platform }}

    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: Launcher-${{ matrix.platform }}
        path: artifacts/
        if-no-files-found: error
