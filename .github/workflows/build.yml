name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      platform:
        description: 'Target platform'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - x86

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish portable package
      run: >
        dotnet publish WinUI3Desktop.csproj
        -c ${{ github.event.inputs.configuration }}
        -f net10.0-windows10.0.19041.0
        -r win-${{ github.event.inputs.platform }}
        --self-contained false
        --no-restore
        -p:Platform=${{ github.event.inputs.platform }}
        -o artifacts/Launcher-${{ github.event.inputs.configuration }}-${{ github.event.inputs.platform }}

    - name: List published files
      shell: pwsh
      run: Get-ChildItem -Path artifacts -Recurse | Select-Object FullName, Length

    - name: Upload portable package
      uses: actions/upload-artifact@v4
      with:
        name: Launcher-${{ github.event.inputs.configuration }}-${{ github.event.inputs.platform }}
        path: artifacts/Launcher-${{ github.event.inputs.configuration }}-${{ github.event.inputs.platform }}/
        if-no-files-found: error
