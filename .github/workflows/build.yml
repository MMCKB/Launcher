name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      platform:
        description: 'Target platform'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - x86

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c ${{ github.event.inputs.configuration }} -f net10.0-windows10.0.19041.0 --no-restore

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Launcher-${{ github.event.inputs.configuration }}-${{ github.event.inputs.platform }}
        path: bin/${{ github.event.inputs.platform }}/${{ github.event.inputs.configuration }}/net10.0-windows10.0.19041.0/
